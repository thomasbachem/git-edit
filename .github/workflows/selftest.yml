# Runs git-edit's end-to-end suite on Linux – for each push to main or a `ci/…` branch, each pull request,
# or by hand
name: selftest
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - name: Versions
        run: git --version && zsh --version && nproc
      - name: Suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: ./git-edit --selftest --jobs
      # Each failing check with the lines after it, from the scenarios' kept output
      - name: Failed checks
        if: failure()
        run: grep -h -A6 '  FAIL' "$RUNNER_TEMP"/git-edit-jobs.*/*.out | cut -c1-300 | head -300
